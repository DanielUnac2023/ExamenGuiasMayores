          2,

        [

          "Compromiso que integre fe, servicio, disciplina, protección de menores y ejemplo cristiano.",
          "fe|dios|oracion;servicio;disciplina;proteccion|menores|ninos|seguridad;ejemplo",

      ];

      let currentSectionIndex = 0;
      let userResponses = {}; // Almacena las respuestas del usuario por índice de pregunta

      const N = (s) =>
        s
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      const isMC = (q) => q.length === 3;
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

      function renderSection() {
        const section = sections[currentSectionIndex];
        const container = document.getElementById("quiz-container");

        // Actualizar textos de cabecera y barra de progreso
        document.getElementById("section-counter-label").innerText = `Sección ${currentSectionIndex + 1} de ${sections.length}`;
        document.getElementById("section-title-label").innerText = section.title;
        const progressPct = ((currentSectionIndex + 1) / sections.length) * 100;
        document.getElementById("progress-bar").style.width = `${progressPct}%`;

        // Botones de navegación
        document.getElementById("prev-btn").disabled = currentSectionIndex === 0;
        const nextBtn = document.getElementById("next-btn");
        if (currentSectionIndex === sections.length - 1) {
          nextBtn.innerText = "¡Sección Final / Repasar respuestas!";
        } else {
          nextBtn.innerText = "Siguiente Sección →";
        }

        // Construir HTML de las preguntas pertenecientes a esta sección
        let html = `
                <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-5 mb-6">
                    <h2 class="text-lg font-bold text-indigo-900 mb-1">${section.title}</h2>
                    <p class="text-xs md:text-sm text-indigo-700">${section.description}</p>
                </div>
            `;

        section.indices.forEach((qIndex) => {
          const q = Q[qIndex];
          const saved = userResponses[qIndex];

          html += `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-7 mb-6">
                    <div class="inline-block bg-slate-100 text-slate-700 font-bold text-xs px-3 py-1 rounded-full mb-3">
                        Pregunta #${qIndex + 1}
                    </div>
                    <h3 class="text-base md:text-lg font-bold text-slate-900 mb-5 leading-snug">
                        ${esc(q[0])}
                    </h3>
                `;

          if (isMC(q)) {
            html += `<div class="space-y-2.5">`;
            q[1].split("|").forEach((opt, optIdx) => {
              let btnClass = "w-full text-left p-3.5 rounded-xl border text-sm font-medium transition flex items-start gap-3 ";
              if (!saved) {
                btnClass += "border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/40 text-slate-700";
              } else {
                if (optIdx === q[2]) {
                  btnClass += "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                } else if (optIdx === saved.sel) {
                  btnClass += "border-rose-500 bg-rose-50 text-rose-900 font-semibold";
                } else {
                  btnClass += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
                }
              }
              const labelChar = "ABCD"[optIdx];
              html += `
                        <button class="${btnClass}" ${saved ? "disabled" : ""} onclick="pickAnswer(${qIndex}, ${optIdx})">
                            <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-slate-200 text-slate-700 text-xs font-bold shrink-0">${labelChar}</span>
                            <span>${esc(opt)}</span>
                        </button>`;
            });
            html += `</div>`;

            if (saved) {
              html += `
                        <div class="mt-4 p-3.5 rounded-xl text-xs md:text-sm font-medium ${saved.ok ? "bg-emerald-50 text-emerald-800 border border-emerald-200" : "bg-rose-50 text-rose-800 border border-rose-200"}">
                            ${saved.ok ? "✔ ¡Correcto!" : "✘ Incorrecto. La respuesta era: <b>" + "ABCD"[q[2]] + ". " + esc(q[1].split("|")[q[2]]) + "</b>"}
                        </div>`;
            }
          } else {
            // Pregunta Abierta
            html += `
                        <textarea id="ta-${qIndex}" ${saved ? "disabled" : ""} class="w-full p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 text-sm mb-3 min-h-[110px] bg-slate-50" placeholder="Escribe tu respuesta con tus propias palabras...">${saved ? esc(saved.txt) : ""}</textarea>
                    `;

            if (!saved) {
              html += `
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-5 rounded-xl transition text-xs shadow-sm" onclick="checkOpenAnswer(${qIndex})">
                            Comprobar respuesta
                        </button>`;
            } else {
              const keywords = q[2].split(";");
              html += `
                        <div class="p-4 rounded-xl text-xs md:text-sm ${saved.ok ? "bg-emerald-50 text-emerald-900 border border-emerald-200" : "bg-rose-50 text-rose-900 border border-rose-200"} space-y-2">
                            <div class="font-bold flex items-center justify-between">
                                <span>${saved.ok ? "✔ Criterio cumplido" : "✘ Requiere ajuste"}</span>
                                <span class="bg-white/70 px-2 py-0.5 rounded border text-xs">${saved.hit.length}/${keywords.length} conceptos (mín. req. ${q[3]})</span>
                            </div>
                            <div class="opacity-90 space-y-1">
                                <p><b>Detectados:</b> ${saved.hit.length ? esc(saved.hit.join(" · ")) : "Ninguno"}</p>
                                <p><b>Faltantes:</b> ${saved.miss.length ? esc(saved.miss.join(" · ")) : "Ninguno"}</p>
                            </div>
                            <div class="pt-2 border-t border-black/10">
                                <p class="font-bold mb-0.5">Respuesta modelo:</p>
                                <p class="italic text-slate-700">${esc(q[1])}</p>
                            </div>
                            <div class="pt-1">
                                <button class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium px-3 py-1 rounded-lg text-xs transition" onclick="toggleManual(${qIndex})">
                                    ${saved.ok ? "Marcar manualmente como incorrecta" : "Marcar manualmente como correcta"}
                                </button>
                            </div>
                        </div>`;
            }
          }
          html += `</div>`;
        });

        container.innerHTML = html;
      }

      function pickAnswer(qIndex, optIdx) {
        userResponses[qIndex] = { sel: optIdx, ok: optIdx === Q[qIndex][2] };
        renderSection();
      }

      function checkOpenAnswer(qIndex) {
        const txtValue = document.getElementById(`ta-${qIndex}`).value;
        const normText = N(txtValue);
        const groups = Q[qIndex][2].split(";");
        const hit = [],
          miss = [];

        groups.forEach((g) => {
          const found = g.split("|").find((syn) => normText.includes(syn));
          if (found) hit.push(found);
          else miss.push(g.split("|")[0]);
        });

        userResponses[qIndex] = {
          txt: txtValue,
          hit: hit,
          miss: miss,
          ok: hit.length >= Q[qIndex][3],
        };
        renderSection();
      }

      function toggleManual(qIndex) {
        userResponses[qIndex].ok = !userResponses[qIndex].ok;
        renderSection();
      }

      function changeSection(direction) {
        if (direction === 1 && currentSectionIndex < sections.length - 1) {
          currentSectionIndex++;
          renderSection();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (direction === -1 && currentSectionIndex > 0) {
          currentSectionIndex--;
          renderSection();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (currentSectionIndex === sections.length - 1 && direction === 1) {
          // Al llegar al final de la última sección, mostrar resumen global
          showGlobalSummary();
        }
      }

      function showGlobalSummary() {
        let totalAnswered = Object.keys(userResponses).length;
        let totalCorrect = Object.values(userResponses).filter((r) => r.ok).length;
        let totalQuestions = Q.length;
        let pct = Math.round((totalCorrect / totalQuestions) * 100);

        document.getElementById("quiz-container").innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
                    <div class="text-5xl mb-3">🏆</div>
                    <h2 class="text-2xl font-extrabold text-slate-900 mb-2">¡Evaluación por Secciones Concluida!</h2>
                    <p class="text-slate-600 text-sm mb-6">Has recorrido y evaluado los 5 bloques del examen de Guía Mayor.</p>
                    
                    <div class="inline-flex items-center justify-center bg-indigo-50 text-indigo-700 font-extrabold text-4xl px-8 py-5 rounded-2xl border border-indigo-100 mb-6">
                        ${totalCorrect} / ${totalQuestions} <span class="text-xl text-indigo-400 font-normal ml-2">(${pct}%)</span>
                    </div>

                    <p class="text-sm md:text-base font-semibold mb-6 ${pct >= 80 ? "text-emerald-600" : pct >= 60 ? "text-amber-600" : "text-rose-600"}">
                        ${pct >= 80 ? "¡Excelente desempeño general! Estás muy preparado." : "Buen esfuerzo. Puedes regresar a cualquier sección anterior para repasar conceptos específicos."}
                    </p>

                    <div class="flex flex-col sm:flex-row gap-3 justify-center">
                        <button onclick="currentSectionIndex=0; renderSection();" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-6 rounded-xl transition text-sm shadow-sm">
                            Volver a revisar secciones
                        </button>
                        <a href="../index.html" class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2.5 px-6 rounded-xl border border-slate-300 transition text-sm shadow-sm inline-block">
                            Ir al Menú Principal
                        </a>
                    </div>
                </div>
            `;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // Inicializar cargando la primera sección
      renderSection();
    </script>
  </body>
