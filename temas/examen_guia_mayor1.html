          "Únicamente el destino.|Ruta, duración, clima, equipo, estado de participantes, comunicaciones y plan de emergencia.|Solo la cantidad de alimentos.|La velocidad del más rápido.",
          1,
        ],
        [
          "Organización de un campamento de dos noches para veinte conquistadores.",
          "Definir zonas, agua potable, alimentos, saneamiento, residuos, supervisión de adultos, seguridad y plan de emergencia.",
          "zona|distribuc|area;agua;alimento|comida;saneamiento|letrina|bano|higiene;residuo|basura;supervision|adulto|proporcion|vigilan;emergencia;seguridad",
          5,
        ],
        [
          "Cómo orientar a un grupo con mapa y brújula.",
          "Orientar el mapa al norte, considerar declinación, tomar el rumbo (azimut), seguirlo con puntos de referencia y corregir desviaciones manteniendo al grupo unido.",
          "norte|declinacion;rumbo|azimut|grados;referencia|corregir|desviacion;mapa|orienta;grupo|seguridad",
          4,
        ],
        [
          "Participante separado del grupo: acciones del líder, comunicaciones y búsqueda.",
          "Detener al grupo, contar, buscar en el último punto visto, comunicar, proteger al grupo y activar el plan de búsqueda/autoridades si no aparece pronto.",
          "detener|parar|contar|alto;buscar|ultimo lugar|ultimo punto;llamar|comunic|radio|telefono|silbato|aviso;plan de busqueda|autoridades|rescate|activar|emergencia",
          3,
        ],
        [
          "Sistema seguro para almacenar alimentos y agua en campamento.",
          "Separar crudos y cocidos, contenedores cerrados y colgados o fuera del alcance de animales, mantener frío y agua potable suficiente.",
          "contaminacion cruzada|separar|crudo;animales|colgar|cierre|hermetic|contenedor;temperatura|refriger|hielera|frio|conserv;agua|hidrata|potable|litros",
          3,
        ],
        [
          "Cinco riesgos ambientales de un campamento y una medida preventiva para cada uno.",
          "Ej.: tormentas, calor, inundaciones, incendios, animales/insectos, terreno inestable, frío; cada uno con medida preventiva.",
          "tormenta|rayo;calor|insolac;inundac|crecida;incendio|fuego;animal|serpiente|picadura|insecto;terreno|caida|arbol|rama;frio|hipotermia;plantas|toxic",
          5,
        ],
        [
          "Responsabilidad principal de un Guía Mayor:",
          "Conseguir que el club gane todas las competencias.|Promover el desarrollo espiritual, físico, mental y social, cuidando la seguridad de los menores.|Hacer personalmente todas las tareas.|Priorizar la disciplina sobre toda consideración humana.",
          1,
        ],
        [
          "Otro adulto tiene conducta inapropiada con un menor. ¿Qué hacer?",
          "Investigar interrogando al menor repetidamente.|Ignorar el comentario si no hay pruebas visibles.|Priorizar la seguridad del menor, reportar por canales de protección y cumplir obligaciones legales.|Prometer secreto absoluto.",
          2,
        ],
        [
          "Dos líderes discrepan y uno desacredita al otro frente a los conquistadores. ¿Cómo intervienes?",
          "Intervenir con calma, hablar con ambos en privado, escuchar, mediar y buscar acuerdo (Mat. 18).",
          "privado|aparte|solas|no delante|discret|reunion;respeto|escuch|medi;acuerdo|concilia|unidad|reconcil|mateo 18",
          2,
        ],
        [
          "Diseña una actividad de servicio comunitario con crecimiento espiritual y habilidades.",
          "Define actividad, beneficio concreto, componente espiritual (devocional) y habilidades que se practican.",
          "servicio|comunidad|beneficio;espiritual|oracion|biblia|devocion;habilidad|capacit|especialidad|taller;evalu|objetivo|plan",
          3,
        ],
        [
          "¿Cómo evalúas el éxito de un club sin depender de miembros, premios o competencias?",
          "Por crecimiento espiritual, servicio e impacto comunitario, retención y participación, desarrollo de los miembros y evaluaciones.",
          "espiritual|transformac|bautismo|vida;servicio|comunidad|impacto;retenc|participacion|crecimiento|desarrollo|encuesta|evalu",
          2,
        ],
        [
          "Conquistador sin recursos para el uniforme completo.",
          "Apoyar con discreción (uniforme usado, fondos, donaciones), manteniendo su dignidad y favoreciendo su participación.",
          "dignidad|privado|discret|confidencial;apoyar|ayuda|fondo|donaci|prestar|recolect|usado|gestion|beca;particip|inclu",
          2,
        ],
        [
          "Cómo preparas a un futuro director de club.",
          "Mentoría, capacitación, delegación gradual de responsabilidades, práctica acompañada y conocimiento del reglamento y de la protección de menores.",
          "mentor|capacit|formar|entrena|delegar|ensenar;responsabilidad|liderazgo|gradual|practica|acompan;curso|manual|reglamento|capacitacion|protecci",
          2,
        ],
        [
          "Escribe tu compromiso personal de Guía Mayor.",
          "Compromiso que integre fe, servicio, disciplina, protección de menores y ejemplo cristiano.",
          "fe|dios|oracion;servicio;disciplina;proteccion|menores|ninos|seguridad;ejemplo",
          4,
        ],
      ];

      const N = (s) =>
        s
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      const isMC = (q) => q.length === 3;
      let i = 0,
        res = {},
        done = false,
        mode = "all",
        list = [];
      const $ = document.getElementById("app");
      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

      function start(m) {
        mode = m;
        list = Q.map((q, k) => k).filter((k) => m === "all" || isMC(Q[k]));
        i = 0;
        res = {};
        done = false;
        render();
      }

      function home() {
        $.innerHTML = `
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
        <h2 class="text-2xl font-bold text-slate-900 mb-3">Simulador · Examen de Investidura</h2>
        <p class="text-slate-600 text-sm md:text-base leading-relaxed mb-6">
            Herramienta interactiva para practicar y afianzar los conocimientos exigidos en la prueba teórica y práctica de Guías Mayores. Las preguntas de opción múltiple se evalúan automáticamente, mientras que las abiertas analizan conceptos clave esperados.
        </p>
        <div class="flex flex-col sm:flex-row gap-4">
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition text-sm shadow-sm" onclick="start('all')">
                Examen Completo (80 preguntas)
            </button>
            <button class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-6 rounded-xl border border-slate-300 transition text-sm shadow-sm" onclick="start('mc')">
                Solo Opción Múltiple (35 preguntas)
            </button>
        </div>
    </div>`;
      }

      function render() {
        if (i >= list.length) return fin();
        const k = list[i],
          q = Q[k],
          r = res[k];
        const pct = Math.round((i / list.length) * 100);

        let h = `
    <!-- Barra de Progreso -->
    <div class="mb-6">
        <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
            <span>Pregunta ${i + 1} de ${list.length}</span>
            <span>${pct}% Completado</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
            <div class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
        </div>
    </div>

    <!-- Tarjeta de Pregunta -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
        <div class="inline-block bg-indigo-50 text-indigo-700 font-bold text-xs px-3 py-1 rounded-full mb-4">
            Pregunta #${k + 1}
        </div>
        <h3 class="text-lg md:text-xl font-bold text-slate-900 mb-6 leading-snug">
            ${esc(q[0])}
        </h3>`;

        if (isMC(q)) {
          h += `<div class="space-y-3">`;
          q[1].split("|").forEach((o, j) => {
            let btnClass =
              "w-full text-left p-4 rounded-xl border text-sm md:text-base font-medium transition flex items-start gap-3 ";
            if (!r) {
              btnClass += "border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/50 text-slate-700";
            } else {
              if (j === q[2]) {
                btnClass += "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
              } else if (j === r.sel) {
                btnClass += "border-rose-500 bg-rose-50 text-rose-900 font-semibold";
              } else {
                btnClass += "border-slate-200 bg-slate-50 text-slate-400 opacity-60";
              }
            }
            const label = "ABCD"[j];
            h += `
            <button class="${btnClass}" ${r ? "disabled" : ""} onclick="pick(${k},${j})">
                <span class="inline-flex items-center justify-center w-6 h-6 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold shrink-0">${label}</span>
                <span>${esc(o)}</span>
            </button>`;
          });
          h += `</div>`;

          if (r) {
            h += `
            <div class="mt-6 p-4 rounded-xl text-sm font-medium ${r.ok ? "bg-emerald-50 text-emerald-800 border border-emerald-200" : "bg-rose-50 text-rose-800 border border-rose-200"}">
                ${r.ok ? "✔ ¡Correcto!" : "✘ Incorrecto. La respuesta correcta era: <b>" + "ABCD"[q[2]] + ". " + esc(q[1].split("|")[q[2]]) + "</b>"}
            </div>`;
          }
        } else {
          h += `
        <textarea id="ta" ${r ? "disabled" : ""} class="w-full p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 text-sm md:text-base mb-4 min-h-[130px] bg-slate-50" placeholder="Escribe tu respuesta aquí con tus palabras...">${r ? esc(r.txt) : ""}</textarea>`;

          if (!r) {
            h += `
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-6 rounded-xl transition text-sm shadow-sm" onclick="chk(${k})">
                Comprobar respuesta
            </button>`;
          } else {
            const g = q[2].split(";");
            h += `
            <div class="p-5 rounded-xl text-sm ${r.ok ? "bg-emerald-50 text-emerald-900 border border-emerald-200" : "bg-rose-50 text-rose-900 border border-rose-200"} space-y-3">
                <div class="font-bold flex items-center justify-between">
                    <span>${r.ok ? "✔ Evaluación: Válida" : "✘ Evaluación: Requiere ajuste"}</span>
                    <span class="text-xs bg-white/70 px-2 py-1 rounded border">${r.hit.length}/${g.length} conceptos (req. ${q[3]})</span>
                </div>
                <div class="text-xs leading-relaxed opacity-90">
                    <p><b>Conceptos detectados:</b> ${r.hit.length ? esc(r.hit.join(" · ")) : "Ninguno"}</p>
                    <p><b>Conceptos faltantes:</b> ${r.miss.length ? esc(r.miss.join(" · ")) : "Ninguno"}</p>
                </div>
                <div class="pt-2 border-t border-black/10">
                    <p class="font-bold mb-1">Respuesta modelo / Criterio:</p>
                    <p class="italic text-slate-700">${esc(q[1])}</p>
                </div>
                <div class="pt-2">
                    <button class="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium px-4 py-1.5 rounded-lg text-xs transition" onclick="tog(${k})">
                        ${r.ok ? "Marcar manualmente como incorrecta" : "Marcar manualmente como correcta"}
                    </button>
                </div>
            </div>`;
          }
        }

        if (r) {
          h += `
        <div class="mt-6 text-right">
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-6 rounded-xl transition text-sm shadow-sm" onclick="i++;render()">
                ${i + 1 === list.length ? "Finalizar y ver resultado" : "Siguiente pregunta →"}
            </button>
        </div>`;
        }

        $.innerHTML = h + "</div>";
      }

      function pick(k, j) {
        res[k] = { sel: j, ok: j === Q[k][2] };
        render();
      }
      function chk(k) {
        const t = document.getElementById("ta").value,
          n = N(t),
          g = Q[k][2].split(";"),
          hit = [],
          miss = [];
        g.forEach((x) => {
          const f = x.split("|").find((a) => n.includes(a));
          f ? hit.push(f) : miss.push(x.split("|")[0]);
        });
        res[k] = { txt: t, hit, miss, ok: hit.length >= Q[k][3] };
        render();
      }
      function tog(k) {
        res[k].ok = !res[k].ok;
        render();
      }

      function fin() {
        const ok = list.filter((k) => res[k] && res[k].ok).length;
        const p = Math.round((ok / list.length) * 100);
        const bad = list.filter((k) => !(res[k] && res[k].ok));

        $.innerHTML = `
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 text-center">
        <h2 class="text-2xl font-extrabold text-slate-900 mb-2">Resultado de la Evaluación</h2>
        <p class="text-slate-500 text-sm mb-6">Resumen de tu rendimiento académico y teórico</p>
        
        <div class="inline-flex items-center justify-center bg-indigo-50 text-indigo-700 font-extrabold text-4xl md:text-5xl px-8 py-6 rounded-2xl border border-indigo-100 mb-6">
            ${ok} / ${list.length} <span class="text-xl text-indigo-400 font-normal ml-2">(${p}%)</span>
        </div>

        <p class="text-base font-semibold mb-6 ${p >= 80 ? "text-emerald-600" : p >= 60 ? "text-amber-600" : "text-rose-600"}">
            ${p >= 80 ? "¡Excelente! Tienes un dominio sólido de los temas." : p >= 60 ? "Buen intento. Revisa las áreas donde tuviste fallos." : "Necesitas repasar más los manuales e historia."}
        </p>

        ${
          bad.length
            ? `
        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 text-left mb-6">
            <span class="font-bold text-xs text-slate-500 uppercase tracking-wider block mb-2">Preguntas para repasar:</span>
            <div class="flex flex-wrap gap-1.5">
                ${bad.map((k) => `<span class="bg-rose-100 text-rose-700 text-xs font-semibold px-2.5 py-1 rounded-md">#${k + 1}</span>`).join("")}
            </div>
        </div>
        `
            : ""
        }

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
            <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-6 rounded-xl transition text-sm shadow-sm" onclick="start('${mode}')">
                Intentar de nuevo
            </button>
            <button class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2.5 px-6 rounded-xl border border-slate-300 transition text-sm shadow-sm" onclick="home()">
                Menú de inicio
            </button>
        </div>
    </div>`;
      }

      home();
    </script>
  </body>
</html>
