<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Examen General de Investidura JA – Simulador</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <!-- Header Principal -->
    <header class="bg-indigo-600 text-white shadow-md">
      <div class="max-w-4xl mx-auto px-6 py-6 flex space-x-6 items-center">
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight">Simulador Examen General de Investidura JA</h1>
          <p class="text-indigo-100 text-xs md:text-sm mt-1">Evaluación organizada por secciones temáticas</p>
        </div>
        <a
          href="../index.html"
          class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-sm"
          >Menú Principal</a
        >
        <button
          onclick="location.reload()"
          class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-sm"
        >
          Reiniciar
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
      <!-- Indicador de Progreso por Secciones -->
      <div class="mb-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
        <div class="flex justify-between text-xs md:text-sm font-semibold text-slate-600 mb-2">
          <span id="section-counter-label">Sección 1 de 6</span>
          <span id="section-title-label" class="text-indigo-600 font-bold">Cargando...</span>
        </div>
        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-indigo-600 h-2.5 transition-all duration-300" style="width: 16.6%"></div>
        </div>
      </div>

      <!-- Contenedor Dinámico de Preguntas por Sección -->
      <div id="exam-container" class="space-y-6">
        <!-- Las preguntas de la sección activa se inyectarán aquí -->
      </div>

      <!-- Barra de Navegación de Secciones -->
      <div class="flex justify-between items-center mt-8 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <button
          id="prev-btn"
          onclick="changeSection(-1)"
          class="bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-medium py-2.5 px-5 rounded-xl text-sm transition disabled:opacity-40 disabled:cursor-not-allowed shadow-sm"
          disabled
        >
          ← Sección Anterior
        </button>
        <span id="section-status-text" class="text-xs font-semibold text-slate-500 hidden sm:inline"></span>
        <button
          id="next-btn"
          onclick="changeSection(1)"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-5 rounded-xl text-sm transition shadow-sm"
        >
          Siguiente Sección →
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
      <p>Plataforma interactiva para Guías Mayores y Conquistadores.</p>
    </footer>

        {

        {

            {

            },
            { n: 33, t: "Los clubes deben ofrecer a los jóvenes desarrollo espiritual y resiliencia.", o: T, a: [1] },
            {

            { n: 35, t: "El consejero debe exigir a los niños un trabajo original y perfecto.", o: T, a: [0] },

        },
        {
          s: "Sección IV: Historia denominacional",
          q: [
            {
              n: 36,
              t: "¿Quién fue el más prominente predicador americano de la Segunda venida de Cristo?",

            },
            {
              n: 37,
              t: "¿Qué profecía estudió Miller para fijar una fecha al regreso de Cristo? Enuncia las dos fechas clave.",
              k: "Daniel 8:14 (los 2300 días/años). Fechas clave: 457 a.C. (decreto de Artajerjes, inicio) y 1844 d.C. (fin; 22 de octubre de 1844).",

            {

            {

              k: "William Foy y Hazen Foss.",
            },
            { n: 41, t: "¿Cómo se conoce a los escritos de Elena G. de White?", k: "Espíritu de Profecía." },
            {

            },

              ],
              a: [3],
            },
            {
              n: 45,
              t: "¿Primer capitán del navío Pitcairn?",
              o: ["El Hno. John Tay", "J.N. Andrews", "Uriah Smith", "Ninguno de los anteriores"],
              a: [3],
            },
            {
              n: 46,
              t: "¿Cuáles son pioneros del movimiento JA? (marca todas las correctas)",
              o: ["Milton Kern", "Luther Warren", "Arthur W. Spaulding", "John Hancock", "Ninguno de los anteriores"],
              a: [0, 1, 2],
              m: 1,
            },
            {
              n: 47,
              t: "Harriet Holt fue una de las promotoras de la idea del Club de Conquistadores y creadora de las primeras clases JA: Amigo, Compañero, Guía y Guía Mayor.",
              o: T,
              a: [1],
            },
            { n: 48, t: "C. Lester Bond adaptó y creó las primeras Especialidades JA.", o: T, a: [1] },
            {
              n: 49,

            {

            },
            { n: 53, t: "En 1863 ocurrió la caída de las estrellas.", o: T, a: [0] },
            { n: 54, t: "En 1755 ocurrió un gran terremoto en la ciudad de Lisboa, Portugal.", o: T, a: [1] },
            { n: 55, t: "El mensaje del primer ángel declara la caída de la Babilonia espiritual.", o: T, a: [0] },
            { n: 56, t: "El mensaje del tercer ángel proclama la adoración al Creador.", o: T, a: [0] },
            { n: 57, t: "El mensaje del segundo ángel declara la caída de la Babilonia espiritual.", o: T, a: [1] },
          ],
        },
        {
          s: "Sección VI: Especialidades",
          q: [
            {
              n: 59,
              t: "Escribe el motivo principal por el cual se desarrollan las especialidades.",
              k: "Para que el joven descubra y desarrolle habilidades, pasatiempos y conocimientos útiles que enriquezcan su vida, lo preparen para servir a otros y lo acerquen a Dios a través de la naturaleza y el trabajo.",
            },
            {
              n: 60,
              t: "¿Qué significa poder alcanzar una maestría?",
              k: "Completar un grupo de especialidades relacionadas de una misma área (por ejemplo, naturaleza o artes manuales), lo que demuestra un dominio amplio de ese campo y se reconoce con la insignia de Maestría.",
            },
            {
              n: "Gracia",
              t: "¿Para qué es la barra de buena conducta?",
              k: "Para reconocer el logro individual y la buena conducta sostenida durante un año; cada año adicional se señala con una estrella dorada.",
            },
          ],
        },
      ];

      let currentSectionIndex = 0;
      let userAnswers = {};

      const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

      function renderSection() {
        const sec = sections[currentSectionIndex];
        const container = document.getElementById("exam-container");

        // Actualizar barra e indicadores
        document.getElementById("section-counter-label").innerText = `Sección ${currentSectionIndex + 1} de ${sections.length}`;
        document.getElementById("section-title-label").innerText = sec.s;
        const pct = ((currentSectionIndex + 1) / sections.length) * 100;
        document.getElementById("progress-bar").style.width = `${pct}%`;

        // Botones de navegación
        document.getElementById("prev-btn").disabled = currentSectionIndex === 0;
        const nextBtn = document.getElementById("next-btn");
        if (currentSectionIndex === sections.length - 1) {
          nextBtn.innerText = "Calificar / Finalizar →";
        } else {
          nextBtn.innerText = "Siguiente Sección →";
        }

        let html = `
            <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-5 mb-6">
                <h2 class="text-base md:text-lg font-bold text-indigo-900">${sec.s}</h2>
                <p class="text-xs text-indigo-700 mt-1">Responde las preguntas de este apartado y avanza cuando estés listo.</p>
            </div>
        `;

        sec.q.forEach((q, qi) => {
          const uniqueKey = `sec_${currentSectionIndex}_q_${qi}`;
          const saved = userAnswers[uniqueKey];

          html += `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-7 mb-6">
                <div class="inline-block bg-slate-100 text-slate-700 font-bold text-xs px-3 py-1 rounded-full mb-3">
                    Pregunta #${q.n}
                </div>
                <p class="text-base font-bold text-slate-900 mb-4 leading-snug">
                    ${esc(q.t)}
                </p>
            `;

          if (q.k) {
            // Pregunta Abierta
            html += `
                    <textarea id="ta_${uniqueKey}" class="w-full p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 text-sm mb-3 min-h-[100px] bg-slate-50" placeholder="Escribe tu respuesta..." oninput="saveOpen('${uniqueKey}')">${saved ? esc(saved.txt || "") : ""}</textarea>
                    <details class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-slate-700">
                        <summary class="cursor-pointer font-bold text-indigo-600">Ver respuesta modelo</summary>
                        <p class="mt-2 italic">${esc(q.k)}</p>
                    </details>
                `;
          } else {
            // Pregunta Cerrada (Radio o Checkbox)
            const isCheck = q.m ? true : false;
            const ty = isCheck ? "checkbox" : "radio";

            html += `<div class="space-y-2.5">`;
            q.o.forEach((opt, oi) => {
              let isChecked = false;
              if (saved) {
                if (isCheck) isChecked = saved.sel.includes(oi);
                else isChecked = saved.sel === oi;
              }

              html += `
                    <label class="flex items-start gap-3 p-3.5 rounded-xl border border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/40 cursor-pointer transition text-sm">
                        <input type="${ty}" name="${uniqueKey}" value="${oi}" ${isChecked ? "checked" : ""} onchange="saveClosed('${uniqueKey}', ${qi}, ${isCheck})" class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
                        <span class="text-slate-700 font-medium">${esc(opt)}</span>
                    </label>`;
            });
            html += `</div>`;
          }

          html += `</div>`;
        });

        container.innerHTML = html;
      }

      function saveOpen(key) {
        const val = document.getElementById(`ta_${key}`).value;
        userAnswers[key] = { txt: val };
      }

      function saveClosed(key, qi, isCheck) {
        const inputs = document.querySelectorAll(`input[name="${key}"]:checked`);
        const values = Array.from(inputs).map((inp) => +inp.value);
        userAnswers[key] = { sel: isCheck ? values : values[0] };
      }

      function changeSection(dir) {
        if (dir === 1 && currentSectionIndex < sections.length - 1) {
          currentSectionIndex++;
          renderSection();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (dir === -1 && currentSectionIndex > 0) {
          currentSectionIndex--;
          renderSection();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else if (currentSectionIndex === sections.length - 1 && dir === 1) {
          gradeExam();
        }
      }

      function gradeExam() {
        let totalClosed = 0;
        let correctClosed = 0;

        sections.forEach((sec, si) => {
          sec.q.forEach((q, qi) => {
            if (!q.k) {
              totalClosed++;
              const uniqueKey = `sec_${si}_q_${qi}`;
              const saved = userAnswers[uniqueKey];
              if (saved !== undefined) {
                const sel = q.m ? (saved.sel || []).slice().sort().join() : String(saved.sel ?? "");
                const good = q.a.slice().sort().join() === sel;
                if (good) correctClosed++;
              }
            }
          });
        });

        const pct = totalClosed > 0 ? Math.round((correctClosed / totalClosed) * 100) : 0;

        document.getElementById("exam-container").innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
                <div class="text-5xl mb-3">🏆</div>
                <h2 class="text-2xl font-extrabold text-slate-900 mb-2">¡Examen Calificado!</h2>
                <p class="text-slate-500 text-sm mb-6">Resultado correspondiente a las preguntas de opción múltiple y verdadero/falso.</p>
                
                <div class="inline-flex items-center justify-center bg-indigo-50 text-indigo-700 font-extrabold text-4xl px-8 py-5 rounded-2xl border border-indigo-100 mb-6">
                    ${correctClosed} / ${totalClosed} <span class="text-xl text-indigo-400 font-normal ml-2">(${pct}%)</span>
                </div>

                <p class="text-base font-semibold mb-6 ${pct >= 80 ? "text-emerald-600" : pct >= 60 ? "text-amber-600" : "text-rose-600"}">
                    ${pct >= 80 ? "¡Excelente dominio de los temas de investidura!" : "Buen esfuerzo. Revisa los apartados teóricos para reforzar."}
                </p>

                <div class="flex flex-col sm:flex-row gap-3 justify-center">
                    <button onclick="currentSectionIndex=0; renderSection();" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-6 rounded-xl transition text-sm shadow-sm">
                        Repasar Secciones Nuevamente
                    </button>
                    <button onclick="location.reload()" class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2.5 px-6 rounded-xl border border-slate-300 transition text-sm shadow-sm">
                        Reiniciar Examen Completo
                    </button>
                </div>
            </div>
        `;

        document.getElementById("prev-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("section-counter-label").innerText = "Calificación Final";
        document.getElementById("section-title-label").innerText = "Completado";
        document.getElementById("progress-bar").style.width = `100%`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // Inicializar cargando la primera sección
      renderSection();
    </script>
  </body>
</html>
